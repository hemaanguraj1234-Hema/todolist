<html>
<center>
<head>
<title>To Do List</title>

<style>

body
{
    background-color: lightyellow;
    font-family: Arial;
}

h1
{
    color: navy;
}

input
{
    padding: 8px;
}

button
{
    background-color: orange;
    color: white;
    padding: 8px;
    border: none;
    margin: 5px;
}

</style>

</head>
<body>

<h1>TO DO LIST</h1>

<center>
<input type="text" id="input">
<button type="button" onclick="createTask()">Click</button>

<h1>Task To Do</h1>

<div id="list">
</div>

<script>

function createTask()
{
    let task = document.getElementById("input").value;

    if(task == "")
    {
        alert("Enter the task");
        return;
    }

    document.getElementById("list").innerHTML +="<div><h3>" + task + "</h3><button onclick='deleteTask(this)'>Delete</button><button onclick='completeTask(this)'>Complete</button></div>";

    document.getElementById("input").value = "";
}

function deleteTask(btn)
{
    btn.parentElement.remove();
}

function completeTask(btn)
{
    btn.parentElement.getElementsByTagName("h3")[0].style.textDecoration = "line-through";
}

</script>
</center>
</body>
</html>
